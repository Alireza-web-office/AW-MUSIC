name: AW MUSIC Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build AW MUSIC APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AW-MUSIC-project

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AW-MUSIC-APK
          path: AW-MUSIC-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error