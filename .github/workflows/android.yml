
name: AW MUSIC 4.0.1 Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          curl -fL --retry 5 --retry-all-errors \
            https://downloads.gradle.org/distributions/gradle-8.9-bin.zip \
            -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Select AW MUSIC 4.0.1 Project
        run: |
          DIR="AW-MUSIC-4.0.1-IMPROVED-SOURCE/AW-MUSIC-V2"

          if [ ! -f "$DIR/settings.gradle.kts" ]; then
            echo "Project not found!"
            find . -name settings.gradle.kts
            exit 1
          fi

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" clean assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/AW-MUSIC-4.0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AW-MUSIC-4.0.1-APK
          path: release/AW-MUSIC-4.0.1.apk
          if-no-files-found: error
