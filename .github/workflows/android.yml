name: AW MUSIC Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 8.9
        run: |
          curl -fL --retry 5 --retry-all-errors \
            --retry-delay 10 \
            https://downloads.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: gradle --version

      - name: Build APK
        run: gradle -p AW-MUSIC-project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AW-MUSIC-APK
          path: AW-MUSIC-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error